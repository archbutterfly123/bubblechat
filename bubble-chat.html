<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bubble Chat Overlay</title>
<style>
body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: 'Segoe UI', sans-serif;
}
.chat-box {
    width: 400px;
    height: 580px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 10px;
    box-sizing: border-box;
    overflow-y: hidden;
    position: relative;
}
.bubble.viewer {
    padding: 14px 20px;
    margin: 4px 0 4px 5px;
    border-radius: 30px;
    max-width: 85%;
    background: #9600C8;
    color: #fff;
    align-self: flex-start;
}
.bubble.streamer {
    padding: 14px 20px;
    margin: 4px 5px 4px 0;
    border-radius: 30px;
    max-width: 85%;
    background: #780000;
    color: #fff;
    align-self: flex-end;
}
</style>
</head>
<body>

<div id="chat-box" class="chat-box"></div>

<script src="https://cdn.jsdelivr.net/npm/tmi.js@1.8.5/dist/tmi.min.js"></script>
<script>
const CHANNEL_NAME = "onlyarchangel"; // lowercase for Twitch
const MAX_MESSAGES = 50;
const MESSAGE_LIFETIME = 70000;

function createBubble(nick, message, isStreamer) {
    const chatBox = document.getElementById("chat-box");
    const bubble = document.createElement("div");
    bubble.classList.add("bubble", isStreamer ? "streamer" : "viewer");
    bubble.innerHTML = `<strong>${nick}:</strong> ${message}`;
    chatBox.appendChild(bubble);

    if (chatBox.children.length > MAX_MESSAGES) {
        chatBox.removeChild(chatBox.firstChild);
    }

    setTimeout(() => bubble.remove(), MESSAGE_LIFETIME);
}

// Connect to Twitch chat
const client = new tmi.Client({
    connection: { secure: true, reconnect: true },
    channels: [CHANNEL_NAME]
});

client.connect().then(() => {
    console.log("✅ Connected to Twitch chat");
}).catch(err => {
    console.error("❌ Connection error:", err);
});

client.on('message', (channel, userstate, message) => {
    console.log("📩 Message received:", userstate['display-name'], message);
    const isStreamer = userstate.username.toLowerCase() === CHANNEL_NAME;
    createBubble(userstate['display-name'], message, isStreamer);
});
</script>
</body>
</html>
